name: Zied Quant backtest

on:
  workflow_dispatch:
    inputs:
      folds:
        description: "walk-forward folds"
        default: "5"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          pip install numpy pandas requests scikit-learn lightgbm
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: zied_data
          key: zied-state-${{ github.run_id }}
          restore-keys: zied-state-
      - name: Backtest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python zied_quant.py backtest ${{ github.event.inputs.folds }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest
          path: zied_data/backtest.json
          if-no-files-found: ignore
