name: Zied Quant backtest

on:
  workflow_dispatch:
    inputs:
      folds:
        description: "walk-forward folds"
        default: "5"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          pip install numpy pandas requests scikit-learn lightgbm
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: zied_data
          key: zied-state-${{ github.run_id }}
          restore-keys: zied-state-
      # Durable state-data is the source of truth; cache is only a best-effort fallback.
      - name: Restore durable learning state
        shell: bash
        run: |
          set -euo pipefail
          if git fetch origin state-data:refs/remotes/origin/state-data 2>/dev/null; then
            rm -rf zied_data zied_data_store
            if git ls-tree -r --name-only origin/state-data | grep -qx 'zied_data_store/manifest.json'; then
              git checkout origin/state-data -- zied_data_store
              python state_chunks.py unpack zied_data_store zied_data
              echo "DURABLE_STATE=restored_from_chunks"
            elif git ls-tree -r --name-only origin/state-data | grep -q '^zied_data/'; then
              git checkout origin/state-data -- zied_data
              echo "DURABLE_STATE=restored_legacy"
            else
              mkdir -p zied_data
              echo "DURABLE_STATE=branch_has_no_state"
            fi
          else
            echo "DURABLE_STATE=cache_or_first_run_fallback"
            mkdir -p zied_data
          fi
          echo "=== Backtest state files ==="
          find zied_data -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort
          for f in paper.db train.npz model.pt gbm.pkl meta.json; do
            if [ -s "zied_data/$f" ]; then echo "FOUND: $f"; else echo "MISSING/EMPTY: $f"; fi
          done
      - name: Backtest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python zied_quant.py backtest ${{ github.event.inputs.folds }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest
          path: zied_data/backtest.json
          if-no-files-found: ignore
