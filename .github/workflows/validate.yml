name: Offline validation

on:
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/validate.yml"
  push:
    branches:
      - fix/priority-risk-exits-pnl-research

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (CPU)
        run: |
          pip install numpy pandas requests scikit-learn lightgbm
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run offline test suite
        run: python -m unittest discover -s tests -v
