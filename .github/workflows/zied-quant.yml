name: Zied Quant hourly

on:
  schedule:
    - cron: "7 * * * *"        # every hour at minute 07 (UTC)
  workflow_dispatch:           # manual run button

concurrency:
  group: zied-quant            # never run two cycles at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU torch)
        run: |
          pip install numpy pandas requests
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Runners are ephemeral: restore the model, training set and paper-trading DB.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: zied_data
          key: zied-state-${{ github.run_id }}
          restore-keys: zied-state-

      - name: Run one cycle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # OKX_BASE: https://aws.okx.com   # uncomment if www.okx.com is blocked from the runner
        run: python zied_quant.py once

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: zied_data
          key: zied-state-${{ github.run_id }}
