name: Zied Quant hourly

on:
  schedule:
    - cron: "7 * * * *"        # every hour at minute 07 (UTC)
  workflow_dispatch:

concurrency:
  group: zied-quant            # never run two cycles at once
  cancel-in-progress: false

# The workflow writes only its private state branch; strategy source stays on main.
permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU torch)
        run: |
          pip install numpy pandas requests scikit-learn lightgbm
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Fast recovery path. Cache is useful, but it can be evicted by GitHub.
      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: zied_data
          key: zied-state-${{ github.run_id }}
          restore-keys: zied-state-

      # Durable source of truth: the private state-data branch, independent of cache expiry.
      - name: Restore durable state
        shell: bash
        run: |
          set -euo pipefail
          if git fetch origin state-data:refs/remotes/origin/state-data 2>/dev/null; then
            if git ls-tree -r --name-only origin/state-data | grep -q '^zied_data/'; then
              git checkout origin/state-data -- zied_data
              echo "DURABLE_STATE=restored"
            else
              echo "DURABLE_STATE=branch_empty"
            fi
          else
            echo "DURABLE_STATE=first_run_no_branch"
          fi

      - name: Verify restored memory
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Persistent state files ==="
          if [ ! -d zied_data ]; then
            echo "zied_data directory is missing"
            exit 1
          fi
          find zied_data -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          for f in paper.db model.pt gbm.pkl meta.json train.npz; do
            if [ -s "zied_data/$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING/EMPTY: $f"
            fi
          done

      - name: Run one cycle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # OKX_BASE: https://aws.okx.com   # uncomment if www.okx.com is blocked from the runner
        run: python zied_quant.py once

      # Keep cache for fast recovery, even if the Python cycle fails.
      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: zied_data
          key: zied-state-${{ github.run_id }}

      # Save the complete state to a dedicated branch. This does not change main's source code.
      - name: Save durable state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d zied_data ]; then
            echo "ERROR: zied_data does not exist; refusing to overwrite durable state."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/zied-state-backup"
          rm -rf "$RUNNER_TEMP/zied-state-backup/zied_data"
          cp -a zied_data "$RUNNER_TEMP/zied-state-backup/zied_data"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan state-data-tmp
          git rm -rf . >/dev/null 2>&1 || true
          rm -rf zied_data
          cp -a "$RUNNER_TEMP/zied-state-backup/zied_data" ./zied_data
          git add -f zied_data
          if git diff --cached --quiet; then
            echo "No persistent state files to commit."
            exit 1
          fi
          git commit -m "Persist quant learning state [skip ci]"
          git push --force origin HEAD:state-data
          echo "Durable learning state saved to state-data."

      # Convenient downloadable backup of the SQLite paper-trading DB.
      - name: Backup DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zied-paper-db
          path: zied_data/paper.db
          retention-days: 14
          if-no-files-found: ignore
