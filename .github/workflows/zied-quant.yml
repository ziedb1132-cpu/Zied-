name: Zied Quant hourly

on:
  schedule:
    # 03:00 Tunisia time (UTC+1) = 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      reset_state:
        description: "ابدأ من الصفر: امسح ذاكرة التعلم والإشارات الورقية السابقة"
        required: true
        type: boolean
        default: false

concurrency:
  group: zied-quant
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU torch)
        run: |
          pip install numpy pandas requests scikit-learn lightgbm
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Restore state cache
        if: ${{ inputs.reset_state != true }}
        uses: actions/cache/restore@v4
        with:
          path: zied_data
          key: zied-state-${{ github.run_id }}
          restore-keys: zied-state-

      - name: Restore durable state
        if: ${{ inputs.reset_state != true }}
        id: restore_state
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin state-data >/dev/null 2>&1; then
            git fetch --no-tags origin +refs/heads/state-data:refs/remotes/origin/state-data
            STATE_REF=refs/remotes/origin/state-data
            echo "STATE_DATA_COMMIT=$(git rev-parse "$STATE_REF")"
            # Test the exact required blobs instead of parsing recursive ls-tree output.
            if git cat-file -e "$STATE_REF:zied_data_store/manifest.json" 2>/dev/null; then
              git checkout "$STATE_REF" -- zied_data_store
              test -s zied_data_store/manifest.json
              rm -rf zied_data_restore
              python state_chunks.py unpack zied_data_store zied_data_restore
              python state_integrity.py zied_data_restore --require-db --require-tracked-data
              rm -rf zied_data
              mv zied_data_restore zied_data
              echo "source=durable_chunks" >> "$GITHUB_OUTPUT"
              echo "DURABLE_STATE=restored_from_chunks"
            elif git cat-file -e "$STATE_REF:zied_data/paper.db" 2>/dev/null; then
              git checkout "$STATE_REF" -- zied_data
              python state_integrity.py zied_data --require-db --require-tracked-data
              echo "source=durable_legacy" >> "$GITHUB_OUTPUT"
              echo "DURABLE_STATE=restored_legacy"
            else
              echo "ERROR: state-data branch exists but required state blobs were not found; refusing to start with empty memory." >&2
              git ls-tree --name-only "$STATE_REF" >&2 || true
              exit 1
            fi
          elif [ -s zied_data/paper.db ]; then
            python state_integrity.py zied_data --require-db --require-tracked-data
            echo "source=cache" >> "$GITHUB_OUTPUT"
            echo "DURABLE_STATE=validated_cache_fallback"
          else
            echo "source=first_run" >> "$GITHUB_OUTPUT"
            echo "DURABLE_STATE=first_run_no_branch_or_cache"
          fi

      - name: Initialize clean state when reset requested
        if: ${{ inputs.reset_state == true }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf zied_data zied_data_store
          mkdir -p zied_data
          echo "RESET_STATE=true; old cache and state-data were intentionally not restored."

      - name: Verify restored memory
        shell: bash
        env:
          STATE_SOURCE: ${{ steps.restore_state.outputs.source || 'reset' }}
        run: |
          set -euo pipefail
          echo "=== Persistent state files (source: $STATE_SOURCE) ==="
          mkdir -p zied_data
          find zied_data -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort
          if [ "$STATE_SOURCE" = "durable_chunks" ] || [ "$STATE_SOURCE" = "durable_legacy" ] || [ "$STATE_SOURCE" = "cache" ]; then
            python state_integrity.py zied_data --require-db --require-tracked-data
          else
            python state_integrity.py zied_data
          fi
          for f in paper.db model.pt gbm.pkl meta.json train.npz; do
            if [ -s "zied_data/$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING/EMPTY: $f"
            fi
          done

      - name: Check restored SQLite state
        shell: bash
        run: |
          set -euo pipefail
          python state_integrity.py zied_data

      - name: Run one complete quant cycle and save state
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CYCLES_PER_WORKFLOW: "1"
          RUN_DAILY_BACKTEST: ${{ github.event_name == 'schedule' && github.event.schedule == '0 2 * * *' && '1' || '0' }}
        run: bash .github/scripts/run_100_cycles.sh

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: zied_data
          key: zied-state-${{ github.run_id }}

      - name: Backup DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zied-paper-db
          path: zied_data/paper.db
          retention-days: 14
          if-no-files-found: ignore

      - name: Start next workflow after successful cycle
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run zied-quant.yml --ref main
