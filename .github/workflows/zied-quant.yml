name: Zied Quant hourly

on:
  workflow_dispatch:
    inputs:
      reset_state:
        description: "ابدأ من الصفر: امسح ذاكرة التعلم والإشارات الورقية السابقة"
        required: true
        type: boolean
        default: false

concurrency:
  group: zied-quant
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU torch)
        run: |
          pip install numpy pandas requests scikit-learn lightgbm
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Restore state cache
        if: ${{ inputs.reset_state != true }}
        uses: actions/cache/restore@v4
        with:
          path: zied_data
          key: zied-state-${{ github.run_id }}
          restore-keys: zied-state-

      - name: Restore durable state
        if: ${{ inputs.reset_state != true }}
        shell: bash
        run: |
          set -euo pipefail
          if git fetch origin state-data:refs/remotes/origin/state-data 2>/dev/null; then
            if git ls-tree -r --name-only origin/state-data | grep -qx 'zied_data_store/manifest.json'; then
              git checkout origin/state-data -- zied_data_store
              rm -rf zied_data
              python state_chunks.py unpack zied_data_store zied_data
              echo "DURABLE_STATE=restored_from_chunks"
            elif git ls-tree -r --name-only origin/state-data | grep -q '^zied_data/'; then
              git checkout origin/state-data -- zied_data
              echo "DURABLE_STATE=restored_legacy"
            else
              echo "DURABLE_STATE=branch_has_no_state"
            fi
          else
            echo "DURABLE_STATE=first_run_no_branch"
          fi

      - name: Initialize clean state when reset requested
        if: ${{ inputs.reset_state == true }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf zied_data zied_data_store
          mkdir -p zied_data
          echo "RESET_STATE=true; old cache and state-data were intentionally not restored."

      - name: Verify restored memory
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Persistent state files ==="
          if [ ! -d zied_data ]; then
            echo "No durable state found yet; cache or first-run initialization will be used."
            mkdir -p zied_data
          fi
          find zied_data -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort
          for f in paper.db model.pt gbm.pkl meta.json train.npz; do
            if [ -s "zied_data/$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING/EMPTY: $f"
            fi
          done

      - name: Run one complete quant cycle and save state
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CYCLES_PER_WORKFLOW: "1"
        run: bash .github/scripts/run_100_cycles.sh

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: zied_data
          key: zied-state-${{ github.run_id }}

      - name: Backup DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zied-paper-db
          path: zied_data/paper.db
          retention-days: 14
          if-no-files-found: ignore

      - name: Start next workflow after successful cycle
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run zied-quant.yml --ref main
